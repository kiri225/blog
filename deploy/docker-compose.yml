x-build-proxy: &build-proxy
  network: host
  args:
    HTTP_PROXY: http://127.0.0.1:7890
    HTTPS_PROXY: http://127.0.0.1:7890
    http_proxy: http://127.0.0.1:7890
    https_proxy: http://127.0.0.1:7890
    NO_PROXY: localhost,127.0.0.1,::1
    no_proxy: localhost,127.0.0.1,::1

services:
  backend:
    build:
      context: ./repos/blog
      dockerfile: Dockerfile
      <<: *build-proxy
    container_name: blog-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEPLOY_ENABLED: ${DEPLOY_ENABLED:-1}
      DEPLOY_STACK_DIR: /stack
    volumes:
      - uploads_data:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - .:/stack
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - blog-net
    depends_on:
      deploy-agent:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./repos/Kirameku
      dockerfile: Dockerfile
      <<: *build-proxy
      args:
        BACKEND_URL: http://backend:8000
        HTTP_PROXY: http://127.0.0.1:7890
        HTTPS_PROXY: http://127.0.0.1:7890
        http_proxy: http://127.0.0.1:7890
        https_proxy: http://127.0.0.1:7890
        NO_PROXY: localhost,127.0.0.1,::1,backend
        no_proxy: localhost,127.0.0.1,::1,backend
    container_name: blog-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
      # 运行时拉取网易云/Meting 需经宿主机代理（直连常超时）
      HTTP_PROXY: http://172.17.0.1:7890
      HTTPS_PROXY: http://172.17.0.1:7890
      http_proxy: http://172.17.0.1:7890
      https_proxy: http://172.17.0.1:7890
      NO_PROXY: localhost,127.0.0.1,::1,backend
      no_proxy: localhost,127.0.0.1,::1,backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - blog-net

  admin:
    build:
      context: ./repos/admin
      dockerfile: Dockerfile
      <<: *build-proxy
    container_name: blog-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8848}:80"
    networks:
      - blog-net

  deploy-agent:
    build:
      context: ./deploy-agent
      dockerfile: Dockerfile
      <<: *build-proxy
    container_name: blog-deploy-agent
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - /root/.ssh:/root/.ssh:ro
      - .:/stack
    working_dir: /stack
    networks:
      - blog-net

volumes:
  uploads_data:

networks:
  blog-net:
    driver: bridge
